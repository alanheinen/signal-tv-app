# Builds the APK on every push to main and attaches it to the run.
#
# Repository variables SIGNAL_TV_URL and SIGNAL_RADIO_URL set the two sites
# (otherwise the build points at tv.example.lan and radio.example.lan).
# Secrets SIGNAL_KEYSTORE (base64 of the .jks) and SIGNAL_STORE_PASSWORD sign
# it with your key; without them the APK is signed with a throwaway debug key,
# which installs but can't update a copy signed with your key.
name: apk

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build
        env:
          TV_URL: ${{ vars.SIGNAL_TV_URL }}
          RADIO_URL: ${{ vars.SIGNAL_RADIO_URL }}
          KEYSTORE: ${{ secrets.SIGNAL_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.SIGNAL_STORE_PASSWORD }}
        run: |
          args=(-Psignal.versionCode="$GITHUB_RUN_NUMBER")
          [ -n "$TV_URL" ] && args+=(-Psignal.tvUrl="$TV_URL")
          [ -n "$RADIO_URL" ] && args+=(-Psignal.radioUrl="$RADIO_URL")
          if [ -n "$KEYSTORE" ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/signal.jks"
            ./gradlew --no-daemon assembleRelease "${args[@]}" -Psignal.keystore="$RUNNER_TEMP/signal.jks" -Psignal.storePassword="$STORE_PASSWORD"
            cp app/build/outputs/apk/release/app-release.apk signal-tv.apk
          else
            ./gradlew --no-daemon assembleDebug "${args[@]}"
            cp app/build/outputs/apk/debug/app-debug.apk signal-tv.apk
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signal-tv-apk
          path: signal-tv.apk
